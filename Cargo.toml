[package]
name = "wqc-node"
version = "0.1.0"
edition = "2021"
authors = ["World Quantum Computer Contributors"]
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
colored = "2.1"
ed25519-dalek = "2.1"
futures = "0.3"
libp2p = { version = "0.54", features = ["tokio", "gossipsub", "macros", "tcp", "quic", "noise", "yamux", "identify", "ping"] }
libp2p-stream = "0.2.0-alpha"
num-bigint = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
sysinfo = "0.30"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
