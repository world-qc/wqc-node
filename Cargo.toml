[package]
name = "wqc-node"
version = "0.1.0"
edition = "2021"
authors = ["World Quantum Computer Contributors"]
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
# num-traits = "0.2"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
colored = "2.1"
# Future-proofing for potential P2P expansion
# libp2p = "0.51" # Add when needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
