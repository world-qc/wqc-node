[package]
name = "wqc-node"
version = "0.1.0"
edition = "2021"
authors = ["World Quantum Computer Contributors"]
license = "GPL-3.0"

[dependencies]
# Web server framework
axum = "0.7"
# Async runtime
tokio = { version = "1.0", features = ["full"] }
# For API access control
tower-http = { version = "0.5", features = ["cors"] }
# HTTP client
reqwest = { version = "0.11", features = ["json"] }
# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "2.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# System resource monitoring
sysinfo = "0.30"
# SQLite
rusqlite = { version = "0.39", features = ["bundled"] }
# Future-proofing for potential P2P expansion
# libp2p = "0.51" # Add when needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
